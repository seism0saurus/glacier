<div class="hashtag">
  <!--suppress HtmlUnknownTag -->
  <mat-form-field class="chip-list">
    <mat-label i18n="@@hashtag.form.label">Verfolgte Hashtags</mat-label>
    <!--suppress AngularIncorrectBlockUsage -->
    <mat-chip-grid #chipGrid i18n-aria-label="@@hashtag.chip.grid.aria" aria-label="Hashtag-Auswahl">
      @for (tag of hashtags; track tag) {
        <mat-chip-row
          [removable]="true"
          (removed)="remove(tag)"
          [editable]="true"
          (edited)="edit(tag, $event)"
          [aria-description]="chipEditDescription(tag)"
          [id]="'hashtag-' + tag"
        >
          <!--
            Settling state: while the recentlyTerminated guard is active for this
            hashtag (just removed, guard window not yet expired), show a small
            progress spinner instead of the tag label.

            The spinner signals to the user that the backend is still processing
            the termination.  Once the guard TTL expires, the chip is removed
            from the DOM entirely by the parent list.

            aria-label on the spinner wrapper and MatTooltip are i18n-tagged per
            the UX spec (chip.settling.aria and chip.settling.visual.tooltip).
          -->
          @if (isSettling(tag)) {
            <span
              class="settling-chip-label"
              [attr.aria-label]="settlingAriaLabel"
              [matTooltip]="settlingTooltip"
            >
              <mat-progress-spinner
                mode="indeterminate"
                [diameter]="16"
                aria-hidden="true"
              ></mat-progress-spinner>
            </span>
          } @else {
            {{tag}}
          }
          <mat-icon matChipRemove [attr.aria-label]="chipRemoveLabel(tag)" svgIcon="cancel_icon"></mat-icon>
        </mat-chip-row>
      }
      <input i18n-placeholder="@@hashtag.input.placeholder" placeholder="Neuer Hashtag" #hashtagInput
             [matChipInputFor]="chipGrid"
             [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
             [matChipInputAddOnBlur]="addOnBlur"
             (matChipInputTokenEnd)="add($event)"/>
    </mat-chip-grid>
    <!--
      "Alle entfernen" is embedded as a trailing suffix of the chip field so it
      is visually and programmatically part of the same field as the chips it
      clears — making it clear the action removes the hashtags, not the toots
      (A11Y-F-02 / WCAG 2.5.3 Label-in-Name: the visible tooltip text "Alle
      entfernen" is contained in the aria-label "Alle Hashtags entfernen").
      Icon-only mat-icon-button gives a 40 px target (WCAG 2.5.8) and a keyboard-
      focusable native <button>; the tooltip surfaces the label for sighted
      users while the aria-label names it for assistive technology.
    -->
    <button matSuffix mat-icon-button id="cancel-all" type="button"
            i18n-aria-label="@@hashtag.cancel.all.aria"
            aria-label="Alle Hashtags entfernen"
            [matTooltip]="cancelAllTooltip"
            (click)="clearTags()">
      <mat-icon aria-hidden="true" svgIcon="cancel_icon"></mat-icon>
    </button>
  </mat-form-field>
  <button class="button" id='clear-toots' type="button"
          i18n-aria-label="@@hashtag.clear.toots.aria"
          aria-label="Alle Toots entfernen"
          (click)="clearToots()">
    <mat-icon aria-hidden="true" svgIcon="trash_icon"></mat-icon>
    <span i18n="@@hashtag.clear.toots.label">Toots löschen</span>
  </button>
</div>
