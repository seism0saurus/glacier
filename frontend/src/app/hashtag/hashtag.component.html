<div class="hashtag">
  <!--suppress HtmlUnknownTag -->
  <mat-form-field class="chip-list">
    <mat-label>Followed hashtags</mat-label>
    <!--suppress AngularIncorrectBlockUsage -->
    <mat-chip-grid #chipGrid aria-label="Hashtag selection">
      @for (tag of hashtags; track tag) {
        <mat-chip-row
          [removable]="true"
          (removed)="remove(tag)"
          [editable]="true"
          (edited)="edit(tag, $event)"
          [aria-description]="'press enter to edit hashtag ' + tag"
          [id]="'hashtag-' + tag"
        >
          <!--
            Settling state: while the recentlyTerminated guard is active for this
            hashtag (just removed, guard window not yet expired), show a small
            progress spinner instead of the tag label.

            The spinner signals to the user that the backend is still processing
            the termination.  Once the guard TTL expires, the chip is removed
            from the DOM entirely by the parent list.

            aria-label on the spinner wrapper and MatTooltip are i18n-tagged per
            the UX spec (chip.settling.aria and chip.settling.visual.tooltip).
          -->
          @if (isSettling(tag)) {
            <span
              class="settling-chip-label"
              [attr.aria-label]="settlingAriaLabel"
              [matTooltip]="settlingTooltip"
            >
              <mat-progress-spinner
                mode="indeterminate"
                [diameter]="16"
                aria-hidden="true"
              ></mat-progress-spinner>
            </span>
          } @else {
            {{tag}}
          }
          <mat-icon matChipRemove [attr.aria-label]="'remove hashtag ' + tag" svgIcon="cancel_icon"></mat-icon>
        </mat-chip-row>
      }
      <input placeholder="New hashtag" #hashtagInput
             [matChipInputFor]="chipGrid"
             [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
             [matChipInputAddOnBlur]="addOnBlur"
             (matChipInputTokenEnd)="add($event)"/>
    </mat-chip-grid>
  </mat-form-field>
  <div class="button" id='cancel-all' (click)="clearTags()">
    <mat-icon [attr.aria-label]="'remove all hashtags'" svgIcon="cancel_icon"></mat-icon>
    <span>Cancel All</span>
  </div>
  <div class="button" id='clear-toots' (click)="clearToots()">
    <mat-icon [attr.aria-label]="'remove all toots'" svgIcon="trash_icon"></mat-icon>
    <span>Clear Toots</span>
  </div>
</div>
