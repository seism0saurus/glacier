<header [className]="extended ? 'extended' : 'small'">
  <img [className]="extended ? 'extended' : 'small'"
    src="assets/glacier_logo_small.png" alt="Logo of Glacier - the Mastodon social wall" />
  <h1 i18n="@@header.h1">Glacier - The Mastodon Social Wall</h1>
  <!--
    Share button (P1-17): opens the ShareDialogComponent to let the operator
    create / manage accessible share links and QR codes.

    Positioned between the h1 and the connection-status chip to keep the
    primary action visible without crowding the status indicator.
  -->
  <button
    mat-icon-button
    type="button"
    (click)="openShareDialog()"
    i18n-aria-label="@@header.share.button.aria"
    aria-label="Wand teilen"
    data-testid="share-button"
  >
    <mat-icon aria-hidden="true">share</mat-icon>
  </button>
  <!-- Connection-status chip-pill, right-aligned via margin-inline-start:auto (D-15) -->
  <app-connection-status></app-connection-status>
</header>
