server.address=0.0.0.0
server.port=8080

# Reverse-proxy header trust (D-10, SR-4).
# NONE (default): the container uses the real peer IP — X-Forwarded-For is ignored.
# FRAMEWORK: honour X-Forwarded-For — ONLY set this when behind a trusted reverse proxy
#            (traefik, nginx) that strips forged headers. Without a trusted proxy,
#            FRAMEWORK allows IP spoofing on the rate-limiter key (T-08).
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:NONE}

# connection to fediverse via Mastodon account
mastodon.instance=${INSTANCE:example.com}
mastodon.https=${USE_HTTPS:true}
mastodon.port=${PORT:443}
mastodon.accessToken=${ACCESS_KEY:dummy_access_key}
mastodon.readTimeout=${READ_TIMEOUT:240}
mastodon.writeTimeout=${WRITE_TIMEOUT:240}
mastodon.connectTimeout=${CONNECT_TIMEOUT:240}
mastodon.handle=${HANDLE:the_handle_of_the_account_from_my_acces_key@my_instance}

# this glacier config
glacier.domain=${MY_DOMAIN:example.com}
glacier.operatorName=${MY_NAME:Jon Doe}
glacier.operatorStreetAndNumber=${MY_STREET_AND_NUMBER:somewhere 1}
glacier.operatorZipcode=${MY_ZIP_CODE:12345}
glacier.operatorCity=${MY_CITY:somecity}
glacier.operatorCountry=${MY_COUNTRY:Germany}
glacier.operatorPhone=${MY_PHONE:+123456789}
glacier.operatorMail=${MY_MAIL:mail@example.com}
glacier.operatorWebsite=${MY_WEBSITE:example.com}
glacier.devmode=${DEVMODE:false}

glacier.timeouts.client_reconnect=${GLACIER_TIMEOUT_CLIENT_RECONNECT:300000}

# Cache sizing for HTTP fallback ring buffer (D-02, D-11)
glacier.cache.size=${GLACIER_CACHE_SIZE:20}
glacier.cache.maxHashtagsPerPrincipal=${GLACIER_CACHE_MAX_HASHTAGS_PER_PRINCIPAL:10}
glacier.cache.maxPrincipals=${GLACIER_CACHE_MAX_PRINCIPALS:10000}

# HTTP fallback kill-switch and rate limits (D-10, D-11, SR-4, SR-7)
glacier.fallback.enabled=${GLACIER_FALLBACK_ENABLED:true}
glacier.fallback.ratelimit.perMinute=${GLACIER_FALLBACK_RATELIMIT_PER_WALLID:30}
glacier.fallback.ratelimit.perMinutePerIp=${GLACIER_FALLBACK_RATELIMIT_PER_IP:120}

# Rate-limiter stale-bucket eviction interval in ms (default: 5 min)
glacier.ratelimit.eviction.intervalMs=${GLACIER_RATELIMIT_EVICTION_INTERVAL_MS:300000}

# WebSocket security transport limits (SR-WS-05, ADR-PT-G5-01, OWASP API4)
# glacier.security.ws.message-size-bytes
#   Maximum STOMP frame payload size in bytes (default: 64 KB).
#   Rejects oversized frames to prevent resource exhaustion (CWE-400).
glacier.security.ws.message-size-bytes=${GLACIER_WS_MESSAGE_SIZE_BYTES:65536}

# glacier.security.ws.send-buffer-bytes
#   Maximum per-session send buffer size in bytes (default: 512 KB).
#   Caps memory usage for sessions with slow consumers.
glacier.security.ws.send-buffer-bytes=${GLACIER_WS_SEND_BUFFER_BYTES:524288}

# glacier.security.ws.send-time-ms
#   Maximum time in ms the server will wait for a client to consume a message (default: 20 s).
#   Disconnects sessions that block the send thread (slow-consumer DoS prevention).
glacier.security.ws.send-time-ms=${GLACIER_WS_SEND_TIME_MS:20000}

# WebSocket handshake rate limit (SR-WS-01, ADR-PT-G5-01, OWASP API4)
# glacier.security.ws.handshake.max-per-minute
#   Maximum WebSocket CONNECT attempts per minute per source IP.
#   Prevents cookie-rotation DoS (attacker creates fresh wallIds to bypass per-wallId limits).
glacier.security.ws.handshake.max-per-minute=${GLACIER_WS_HANDSHAKE_MAX_PER_MINUTE:10}

# WebSocket SUBSCRIBE rate limit (SR-WS-02, ADR-PT-G7-01, OWASP API6)
# glacier.security.ws.subscribe.max-per-minute
#   Maximum STOMP SUBSCRIBE frames per minute per (source IP + wallId).
#   Prevents subscription enumeration attacks.
glacier.security.ws.subscribe.max-per-minute=${GLACIER_WS_SUBSCRIBE_MAX_PER_MINUTE:30}

# Cookie security (D-09, SR-3).
# Set COOKIE_SECURE=false only in dev/loopback environments.
# Default true — required for production (TLS is assumed).
glacier.cookie.secure=${COOKIE_SECURE:true}

# Actuator lockdown (SR-7, OWASP A05).
# Only health and info are exposed; the path is moved off /actuator (default is well-known).
# Authentication is NOT added here (no auth framework in this repo) — flagged as a
# Phase 3 finding if the security-auditor raises it.
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/internal/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Timeouts for HEAD requests issued by StompCallback.isLoadable to toot /embed URLs (C-03).
# Without a hard timeout a slow or hung remote Mastodon instance would stall the Bigbone
# virtual thread indefinitely.  3 s connect / 5 s read are conservative defaults that
# absorb transient latency while bounding worst-case thread-hold time per toot.
glacier.embed.connectTimeoutMs=${GLACIER_EMBED_CONNECT_TIMEOUT_MS:3000}
glacier.embed.readTimeoutMs=${GLACIER_EMBED_READ_TIMEOUT_MS:5000}

# ── Share-link feature (ADR-SHARE-09, ADR-SHARE-07) ──────────────────────────
#
# glacier.share.host
#   The hostname (no scheme, no port) that serves the readonly share view.
#   Must be a subdomain of glacier.domain; browser isolation depends on this
#   being a separate origin from the main wall.
#   Security: ShareHostRouter rejects /share/* requests arriving on the main
#   wall host and rejects all other requests on the share host.
#   Override in production: set GLACIER_SHARE_HOST=share.<your-domain>.
glacier.share.host=${GLACIER_SHARE_HOST:share.example.com}

# glacier.share.imgproxy.hmacSecret
#   HMAC-SHA256 key for signing image-proxy URLs (ADR-SHARE-07).
#   INTENTIONALLY UNSET here — the backend refuses to start in production
#   (glacier.cookie.secure=true) unless this is provided via env-var or a
#   secrets manager.  Leaving it unset forces operators to supply the secret
#   rather than running with an accidental default.
#   In dev (glacier.cookie.secure=false) a random secret is auto-generated
#   at startup and logged once as WARN.
#   Minimum length: 32 bytes.  Rotation: bounded by 7-day share TTL; pair
#   with releases.
glacier.share.imgproxy.hmacSecret=${GLACIER_SHARE_IMGPROXY_HMAC_SECRET:#{null}}

# glacier.share.maxActivePerSharer
#   Maximum number of simultaneously active share links per sharer (wallId).
#   Limits the blast radius if a single account is targeted for abuse.
#   Default: 3.
glacier.share.maxActivePerSharer=${GLACIER_SHARE_MAX_ACTIVE_PER_SHARER:3}

# glacier.share.maxActivePerIp
#   Maximum number of simultaneously active share links created from a single
#   source IP address (counted across all sharers from that IP).
#   Requires FORWARD_HEADERS_STRATEGY=FRAMEWORK and a trusted reverse proxy;
#   without it the real client IP is the proxy's IP, making this limit
#   effectively per-proxy rather than per-client.
#   Default: 10.
glacier.share.maxActivePerIp=${GLACIER_SHARE_MAX_ACTIVE_PER_IP:10}

# glacier.share.maxViewersPerLink
#   Maximum number of simultaneous STOMP viewer sessions allowed per share link.
#   New viewers beyond this cap receive a 429 during the WebSocket handshake.
#   Default: 100.
glacier.share.maxViewersPerLink=${GLACIER_SHARE_MAX_VIEWERS_PER_LINK:100}

# glacier.share.ttl
#   Lifetime of a share link as an ISO-8601 duration.
#   After this period, resolve() returns EXPIRED and the catalog endpoint
#   returns {state:"expired"}.  Sharers can revoke earlier.
#   Default: P7D (7 days).
glacier.share.ttl=${GLACIER_SHARE_TTL:P7D}

# glacier.share.sweepIntervalMs
#   How often the background sweeper runs to remove expired share links from
#   the in-memory repository (milliseconds).
glacier.share.sweepIntervalMs=${GLACIER_SHARE_SWEEP_INTERVAL_MS:300000}

# glacier.share.imgproxy.positiveCacheSeconds
#   Caffeine cache TTL for successfully fetched images (1 h default).
glacier.share.imgproxy.positiveCacheSeconds=${GLACIER_SHARE_IMGPROXY_POSITIVE_CACHE_SECONDS:3600}

# glacier.share.imgproxy.negativeCacheSeconds
#   Caffeine cache TTL for failed image proxy fetches (60 s default).
glacier.share.imgproxy.negativeCacheSeconds=${GLACIER_SHARE_IMGPROXY_NEGATIVE_CACHE_SECONDS:60}

