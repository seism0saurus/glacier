version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:00"
    reviewers:
      - "seism0saurus"
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "10:00"
    reviewers:
      - "seism0saurus"
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "12:00"
    reviewers:
      - "seism0saurus"

  - package-ecosystem: "docker"
    directory: "/infrastructure/glacier"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "14:00"
    reviewers:
      - "seism0saurus"
