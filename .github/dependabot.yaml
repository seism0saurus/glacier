version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "08:00"
    # Supply-chain hardening: wait 3 days before opening a PR for any new release.
    # Malicious versions are typically detected and yanked within 1-2 days; the
    # cooldown lets that detect-and-fix cycle complete first. See dependency-vetting skill.
    cooldown:
      default-days: 3
    reviewers:
      - "seism0saurus"
    groups:
      backend:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend/"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "10:00"
    cooldown:
      default-days: 3
    reviewers:
      - "seism0saurus"
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "12:00"
    cooldown:
      default-days: 3
    reviewers:
      - "seism0saurus"

  - package-ecosystem: "docker"
    directory: "/infrastructure/glacier"
    target-branch: "main"
    schedule:
      interval: "daily"
      time: "14:00"
    cooldown:
      default-days: 3
    reviewers:
      - "seism0saurus"
