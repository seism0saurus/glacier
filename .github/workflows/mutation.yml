name: "Mutation Testing"

# Mutation testing is slow (each mutant re-runs the relevant test suite), so it is NOT
# run on every push — it runs weekly and on manual dispatch. Both jobs gate on their
# configured thresholds (PIT 70% in the pom `mutation` profile; Stryker break=70 in
# stryker.config.json), so this workflow goes red if mutation score regresses.
#
# Workflow-injection note: no untrusted inputs (issue/PR titles or bodies) are used in
# any run: command — only static commands.

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Backend mutation testing — PIT against the 15 security-critical target classes
  # (de.seism0saurus.glacier.*) declared in the pom `mutation` profile.
  backend-pit:
    name: PIT (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 23
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run PIT mutation coverage
        # test-compile builds main + test classes (the frontend-maven-plugin provisions
        # its own node); PIT then runs the unit-test suite against the mutants and fails
        # the build if the 70% mutation threshold is not met.
        run: ./mvnw --batch-mode -P mutation clean test-compile org.pitest:pitest-maven:mutationCoverage --file pom.xml
      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pit-report
          path: target/pit-reports

  # Frontend mutation testing — Stryker against the scoped pure-logic units in
  # stryker.config.json (util/hashtag, util/safe-storage, share/pipes/safe-url.pipe).
  frontend-stryker:
    name: Stryker (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Stryker mutation testing
        # ChromeHeadless is preinstalled on ubuntu-latest (same browser the Karma unit
        # tests use). Stryker exits non-zero if the 70% break threshold is not met.
        working-directory: frontend
        run: npm run mutation
      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stryker-report
          path: frontend/reports/mutation
