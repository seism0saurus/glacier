name: "Push Test"

on:
  push:
    branches: ["*.*.*"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: Use cache for local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          # Key includes pom.xml hash so that adding/removing dependencies
          # (e.g. jsoup, caffeine) invalidates the cache automatically.
          key: ${{ runner.os }}-m2-verify-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-verify-
      - name: Use cache for node
        uses: actions/cache@v4
        with:
          path: frontend/node
          key: ${{ runner.os }}-node-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-verify-
      - name: Use cache for node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Compile the webapp
        run: ./mvnw --batch-mode --update-snapshots clean compile --file pom.xml

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: Use cache for local Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-verify-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-verify-
      - name: Use cache for node
        uses: actions/cache/restore@v4
        with:
          path: frontend/node
          key: ${{ runner.os }}-node-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-verify-
      - name: Use cache for node_modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Verify the webapp
        run: ./mvnw --batch-mode verify --file pom.xml
      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports
      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: target/site/jacoco
      - name: Upload Jasmin reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jasmin-reports
          path: frontend/coverage/glacier-frontend

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
      - name: Use cache for local Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-verify-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-verify-
      - name: Use cache for node
        uses: actions/cache/restore@v4
        with:
          path: frontend/node
          key: ${{ runner.os }}-node-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-verify-
      - name: Use cache for node_modules
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Package the webapp
        run:  ./mvnw --batch-mode -DskipTests=true package --file pom.xml -P "SkipUnitTest"
      - name: Check if frontend is bundled into jar
        run: |
          if [[ -d /home/runner/work/glacier/glacier/target/classes/static ]]; then
            echo "angular packaged to jar"
          else
            echo "angular not correctly packaged!"
            ls -lah /home/runner/work/glacier/glacier/target/classes
            exit 1
          fi
      - name: Copy jar
        run: cp /home/runner/work/glacier/glacier/target/glacier-*.jar glacier.jar
      - name: Archive glacier jar
        uses: actions/upload-artifact@v4
        with:
          name: glacier
          path: glacier.jar
          retention-days: 1

  # Standard e2e: chromium + firefox + webkit projects
  # Covers: share-link.spec.ts, share-link-a11y.spec.ts, share-link-qr.spec.ts,
  #         share-link-firefox.spec.ts, share-link-webkit.spec.ts,
  #         share-link-fallback.spec.ts, share-link-rate-limit.spec.ts,
  #         plus all existing wall/toot/subscription specs.
  # The share subdomain (share.proxy) is reachable via the Traefik network alias
  # added to the proxy service in docker-compose.yaml.
  e2e:
    runs-on: ubuntu-latest
    needs: package
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Use cache for ms-playwright
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-verify-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start e2e test inside docker-compose
        working-directory: infrastructure
        run: |
          echo "to update data in infrastructure-content.tar.gz run 'sudo tar -czf infrastructure-content.tar.gz mastodon mastodon.env postgres redis proxy.* v3.ext dynamic.yml traefik.yml'"
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          docker compose -f docker-compose.yaml up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshots
          path: frontend/test-results
      - name: Show logs of service
        working-directory: infrastructure
        if: failure()
        run: |
          docker ps
          docker compose logs

  # Killswitch e2e: verifies GLACIER_FALLBACK_ENABLED=false behaviour
  # Covers: share-link-killswitch.spec.ts (killswitch Playwright project).
  # Under killswitch: catalog returns 200 {state, initialToots:[]};
  # GET /rest/share/{id}/messages returns 404 (mirroring /rest/messages rule).
  e2e-killswitch:
    runs-on: ubuntu-latest
    needs: package
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Use cache for ms-playwright
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-verify-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start e2e killswitch test inside docker-compose
        working-directory: infrastructure
        run: |
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.override.killswitch.yaml \
            up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report (killswitch)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-killswitch
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots (killswitch)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshots-killswitch
          path: frontend/test-results
      - name: Show logs of service (killswitch)
        working-directory: infrastructure
        if: failure()
        run: |
          docker ps
          docker compose -f docker-compose.yaml -f docker-compose.override.killswitch.yaml logs

  # Insecure e2e: verifies plain-HTTP / no-TLS behaviour
  # Covers: share-link-insecure.spec.ts (insecure Playwright project).
  # Under insecure: __Host- prefix and Secure flag are dropped on shareViewerId
  # and wallId cookies (CookieNamingBean, COOKIE_SECURE=false).
  e2e-insecure:
    runs-on: ubuntu-latest
    needs: package
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Use cache for ms-playwright
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-verify-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start e2e insecure test inside docker-compose
        working-directory: infrastructure
        run: |
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.override.insecure.yaml \
            up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report (insecure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-insecure
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots (insecure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-error-screenshots-insecure
          path: frontend/test-results
      - name: Show logs of service (insecure)
        working-directory: infrastructure
        if: failure()
        run: |
          docker ps
          docker compose -f docker-compose.yaml -f docker-compose.override.insecure.yaml logs
