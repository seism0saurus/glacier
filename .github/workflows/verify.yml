name: "Push Test"

on:
  push:
    branches: ["*.*.*"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 23 and cache (save)
        uses: ./.github/actions/setup-java-cache
        with:
          cache-prefix: verify
          cache-mode: save
      - name: Compile the webapp
        run: ./mvnw --batch-mode --update-snapshots clean compile --file pom.xml

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 23 and cache (restore)
        uses: ./.github/actions/setup-java-cache
        with:
          cache-prefix: verify
      - name: Lint the frontend
        working-directory: frontend
        run: npm run lint
      - name: Verify frontend architecture (Sheriff — DDD bounded contexts + layer rules)
        working-directory: frontend
        run: npm run arch
      - name: Check i18n parity (template @@ids vs messages.en.json)
        working-directory: frontend
        run: npm run i18n:check
      - name: Verify sqlite-jdbc SHA-256 checksum
        run: |
          curl -fsSL -o dependency-checksums/sqlite-jdbc-3.49.1.0.jar \
            https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.49.1.0/sqlite-jdbc-3.49.1.0.jar
          sha256sum -c dependency-checksums/sqlite-jdbc-3.49.1.0.sha256
          rm dependency-checksums/sqlite-jdbc-3.49.1.0.jar
      # ADR-SEC-02 supply-chain tripwire: bigbone is the one sanctioned SNAPSHOT (no upstream
      # release exists). A SNAPSHOT is mutable, so resolve it and compare the SHA-256 of the
      # exact jar the build will use against the recorded known-good value. A mismatch fails the
      # job loudly so a human reviews the upstream change and consciously re-pins before merge.
      - name: Verify bigbone snapshot SHA-256 (supply-chain tripwire)
        run: |
          ./mvnw --batch-mode -q dependency:get -Dartifact=social.bigbone:bigbone:2.0.0-SNAPSHOT --file pom.xml
          JAR="$HOME/.m2/repository/social/bigbone/bigbone/2.0.0-SNAPSHOT/bigbone-2.0.0-SNAPSHOT.jar"
          echo "$(awk '{print $1}' dependency-checksums/bigbone-2.0.0-SNAPSHOT.sha256)  $JAR" | sha256sum -c -
      - name: Verify the webapp
        run: ./mvnw --batch-mode verify --file pom.xml
      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-results
          path: target/surefire-reports
      - name: Upload Jacoco reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-reports
          path: target/site/jacoco
      - name: Upload Jasmin reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jasmin-reports
          path: frontend/coverage/glacier-frontend

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 23 and cache (restore)
        uses: ./.github/actions/setup-java-cache
        with:
          cache-prefix: verify
      - name: Package the webapp
        run:  ./mvnw --batch-mode -DskipTests=true package --file pom.xml -P "SkipUnitTest"
      - name: Check if frontend is bundled into jar
        run: |
          if [[ -d /home/runner/work/glacier/glacier/target/classes/static ]]; then
            echo "angular packaged to jar"
          else
            echo "angular not correctly packaged!"
            ls -lah /home/runner/work/glacier/glacier/target/classes
            exit 1
          fi
      - name: Copy jar
        run: cp /home/runner/work/glacier/glacier/target/glacier-*.jar glacier.jar
      - name: Archive glacier jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glacier
          path: glacier.jar
          retention-days: 1

  # ── Playwright e2e matrix ─────────────────────────────────────────────────
  #
  # Each matrix leg boots its own isolated docker-compose stack because the
  # four test modes require mutually incompatible backend configurations:
  #
  #   standard   — default stack (docker-compose.yaml only)
  #                chromium + firefox + webkit Playwright projects
  #   killswitch — GLACIER_FALLBACK_ENABLED=false
  #                (docker-compose.override.killswitch.yaml)
  #   a11y       — WCAG 2.2 AA axe-core scans, chromium-only
  #                (docker-compose.override.a11y.yaml)
  #   insecure   — plain-HTTP :8081 loopback, COOKIE_SECURE=false
  #                (docker-compose.override.insecure.yaml)
  #
  # It is NOT safe to share one running stack across these legs — the killswitch
  # and insecure overrides change runtime behaviour that other projects depend on
  # being in the default state.  See glacier-fallback-mode-discipline skill and
  # infrastructure/docker-compose.override.*.yaml for details.
  e2e:
    runs-on: ubuntu-latest
    needs: package
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            # No override file — runs the default stack.
            # Executes: chromium + firefox + webkit Playwright projects.
            compose_overrides: ""
            artifact_suffix: ""
          - variant: killswitch
            # GLACIER_FALLBACK_ENABLED=false; /rest/messages returns 404.
            # Executes: killswitch Playwright project only.
            compose_overrides: "-f docker-compose.override.killswitch.yaml"
            artifact_suffix: "-killswitch"
          - variant: a11y
            # WCAG 2.2 AA axe-core accessibility scans (chromium-only).
            # Executes: a11y Playwright project only.
            compose_overrides: "-f docker-compose.override.a11y.yaml"
            artifact_suffix: "-a11y"
          - variant: insecure
            # Plain-HTTP :8081 loopback; COOKIE_SECURE=false.
            # Executes: insecure Playwright project only.
            compose_overrides: "-f docker-compose.override.insecure.yaml"
            artifact_suffix: "-insecure"
          - variant: share-https
            # Full owner->viewer share round trip over the realistic HTTPS stack:
            # owner wall at https://glacier.proxy, readonly share view at
            # https://share.glacier.proxy (Traefik routers + ALPN http/1.1 + cert SANs
            # are packed in infrastructure-content.tar.gz). The override sets glacier
            # MY_DOMAIN=glacier.proxy + GLACIER_SHARE_HOST=share.glacier.proxy and the
            # playwright BASE_URL, and runs only the 'share-https' Playwright project
            # (share-wall-roundtrip.spec.ts — excluded from the default chromium project).
            compose_overrides: "-f docker-compose.override.sharehttps.yaml"
            artifact_suffix: "-share-https"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-verify-
      - name: Use cache for ms-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-verify-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-verify-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start e2e test (${{ matrix.variant }}) inside docker-compose
        working-directory: infrastructure
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          echo "to update data in infrastructure-content.tar.gz run 'sudo tar -czf infrastructure-content.tar.gz mastodon mastodon.env postgres redis proxy.* v3.ext dynamic.yml traefik.yml'"
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          # shellcheck disable=SC2086
          docker compose \
            -f docker-compose.yaml \
            $COMPOSE_OVERRIDES \
            up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report${{ matrix.artifact_suffix }}
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots (${{ matrix.variant }})
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-error-screenshots${{ matrix.artifact_suffix }}
          path: frontend/test-results
      - name: Show logs of service (${{ matrix.variant }})
        working-directory: infrastructure
        if: failure()
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          docker ps
          # shellcheck disable=SC2086
          docker compose -f docker-compose.yaml $COMPOSE_OVERRIDES logs
