name: "_e2e"

# Secret-free reusable Playwright e2e core (ADR-CI-01/02). Runs the complete 5-leg matrix
# (standard / killswitch / a11y / insecure / share-https) that glacier-fallback-mode-
# discipline requires -- each leg boots its own isolated docker-compose stack because the
# modes require mutually incompatible backend configurations. No leg may be dropped when
# this file is edited.

on:
  workflow_call:
    inputs:
      legs:
        description: >
          Comma-separated subset of e2e legs to run: standard, killswitch, a11y, insecure,
          share-https. Defaults to all five.
        required: false
        type: string
        default: "standard,killswitch,a11y,insecure,share-https"
      build-image:
        description: >
          Build the Docker image (standard leg only) and upload it as the "glacier-image"
          artifact for a caller's downstream Trivy-image/ZAP jobs to consume.
        required: false
        type: boolean
        default: false
      image-tag:
        description: "Tag applied to the glacier Docker image / used as GLACIER_IMAGE_TAG."
        required: true
        type: string
      cache-prefix:
        description: >
          Cache key family prefix (ADR-CI-09) -- callers reachable from a fork PR MUST pass
          a pull/pr-prefixed value.
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  # ── Leg selection ─────────────────────────────────────────────────────────
  #
  # GitHub does not allow a job-level `if:` to reference the `matrix` context (only "github",
  # "inputs", "needs", "vars" are available there -- matrix is only expanded into
  # jobs.<id>.strategy/env/steps/container/services, never jobs.<id>.if). The previous shape
  # (`if: contains(inputs.legs, matrix.variant)` on the "e2e" job below) parsed as valid YAML,
  # so the SnakeYAML-based structural CI gates never caught it, but GitHub rejects the whole
  # file at push time ("workflow file issue", instant 0s failure on every run) because it never
  # evaluates the expression at all.
  #
  # Fix: compute the already-filtered `matrix.include` list here, from inputs.legs, and hand it
  # to the "e2e" job as a job output consumed via fromJSON -- no job-level `if:` referencing
  # `matrix` anywhere, and only the requested legs ever spin up a runner (rather than spinning
  # up all five and skipping four at the job-if stage, which is what the forbidden shape would
  # have done even if GitHub allowed it).
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix-include: ${{ steps.set.outputs.matrix_include }}
    steps:
      - name: Compute e2e leg matrix from inputs.legs
        id: set
        env:
          LEGS: ${{ inputs.legs }}
        run: |
          # Canonical leg definitions -- the single source of truth for which legs exist.
          # glacier-fallback-mode-discipline requires all five to remain selectable; keep this
          # table in sync with the "e2e" job's doc comment below when adding/renaming a leg.
          all_legs='[
            {"variant":"standard","compose_overrides":"","artifact_suffix":""},
            {"variant":"killswitch","compose_overrides":"-f docker-compose.override.killswitch.yaml","artifact_suffix":"-killswitch"},
            {"variant":"a11y","compose_overrides":"-f docker-compose.override.a11y.yaml","artifact_suffix":"-a11y"},
            {"variant":"insecure","compose_overrides":"-f docker-compose.override.insecure.yaml","artifact_suffix":"-insecure"},
            {"variant":"share-https","compose_overrides":"-f docker-compose.override.sharehttps.yaml","artifact_suffix":"-share-https"}
          ]'
          requested=$(printf '%s' "$LEGS" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | grep -v '^$' \
            | jq -R . \
            | jq -sc .)
          matrix_include=$(jq -c --argjson requested "$requested" \
            '[ .[] | select(.variant as $v | $requested | index($v)) ]' <<<"$all_legs")
          if [[ "$(jq 'length' <<<"$matrix_include")" -eq 0 ]]; then
            echo "::error::inputs.legs ('$LEGS') matched no known e2e leg -- check spelling against standard,killswitch,a11y,insecure,share-https"
            exit 1
          fi
          echo "matrix_include=$matrix_include" >> "$GITHUB_OUTPUT"

  # ── Playwright e2e matrix ─────────────────────────────────────────────────
  #
  #   standard   -- default stack (docker-compose.yaml only)
  #                 chromium + firefox + webkit Playwright projects.
  #                 Optionally builds the Docker image (inputs.build-image) and saves it
  #                 as an artifact for a caller's Trivy-image/ZAP jobs to consume.
  #   killswitch -- GLACIER_FALLBACK_ENABLED=false
  #                 (docker-compose.override.killswitch.yaml)
  #   a11y       -- WCAG 2.2 AA axe-core scans, chromium-only
  #                 (docker-compose.override.a11y.yaml)
  #   insecure   -- plain-HTTP :8081 loopback, COOKIE_SECURE=false
  #                 (docker-compose.override.insecure.yaml)
  #   share-https-- full owner->viewer share round trip over the realistic HTTPS stack
  #                 (docker-compose.override.sharehttps.yaml)
  #
  # It is NOT safe to share one running stack across these legs -- the killswitch and
  # insecure overrides change runtime behaviour that other projects depend on being in the
  # default state. See glacier-fallback-mode-discipline skill and
  # infrastructure/docker-compose.override.*.yaml for details.
  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GLACIER_IMAGE_TAG: "${{ inputs.image-tag }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix-include) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-${{ inputs.cache-prefix }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-${{ inputs.cache-prefix }}-
      - name: Use cache for ms-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ inputs.cache-prefix }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ inputs.cache-prefix }}-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Build Docker image (standard leg only)
        if: matrix.variant == 'standard' && inputs.build-image == true
        working-directory: infrastructure
        run: |
          docker compose -f docker-compose.yaml build
          docker save "ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}" -o glacier-image.tar
      - name: Upload image as artifact (standard leg only)
        if: matrix.variant == 'standard' && inputs.build-image == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glacier-image
          path: infrastructure/glacier-image.tar
      - name: Run syft SBOM against Docker image (standard leg only)
        if: matrix.variant == 'standard' && inputs.build-image == true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}" \
            -o cyclonedx-json=sbom-image.json
      - name: Upload image SBOM (standard leg only)
        if: matrix.variant == 'standard' && inputs.build-image == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image
          path: sbom-image.json
          retention-days: 90
      - name: Start e2e test (${{ matrix.variant }}) inside docker-compose
        working-directory: infrastructure
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          echo "to update data in infrastructure-content.tar.gz run 'sudo tar -czf infrastructure-content.tar.gz mastodon mastodon.env postgres redis proxy.* v3.ext dynamic.yml traefik.yml'"
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          # shellcheck disable=SC2086
          docker compose \
            -f docker-compose.yaml \
            $COMPOSE_OVERRIDES \
            up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report${{ matrix.artifact_suffix }}
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots (${{ matrix.variant }})
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-error-screenshots${{ matrix.artifact_suffix }}
          path: frontend/test-results
      - name: Show logs of service (${{ matrix.variant }})
        working-directory: infrastructure
        if: failure()
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          docker ps
          # shellcheck disable=SC2086
          docker compose -f docker-compose.yaml $COMPOSE_OVERRIDES logs
