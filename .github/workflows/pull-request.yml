name: "Pull Request Test"

# Untrusted-safe tier (ADR-CI-01): runs on every PR, including forks, and must never reach
# a repository secret other than the ambient GITHUB_TOKEN (SR-CI-01/03). Calls the
# secret-free reusable core (_build), the full 5-leg e2e matrix (_e2e), and the
# self-contained dynamic scan (_security-dast) -- none of which are ever passed
# `secrets: inherit` (ADR-CI-02).
#
# Cache keys use the "pull" family (ADR-CI-09) so a fork PR can never read back (or
# poison) the "main" cache family that quality.yml/build-and-deploy.yml populate.
#
# The old inline `coverage-aggregation` job (which ran `gh pr comment` from this untrusted
# context) is retired: the PR number is written to an artifact here and the actual comment
# is posted by the separate privileged pr-comment.yml, triggered via workflow_run
# (ADR-CI-14).

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      cache-prefix: pull

  # Writes the PR number that pr-comment.yml (workflow_run) later reads back, validates,
  # and uses to post the coverage comment -- github.event.number is a GitHub-computed
  # numeric field (not free-text attacker input), but it is still routed through env: and
  # never spliced directly into the shell script text.
  pr-number:
    runs-on: ubuntu-latest
    steps:
      - name: Write PR number
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload PR number artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-number
          path: pr-number.txt
          retention-days: 1

  e2e:
    needs: build
    uses: ./.github/workflows/_e2e.yml
    with:
      legs: "standard,killswitch,a11y,insecure,share-https"
      build-image: false
      image-tag: "pr-${{ github.event.number }}"
      cache-prefix: pull

  # Job id carries the "-sarif" suffix (elevated-scope allowlist, gate 5.2) and this job
  # grants exactly security-events: write beyond the contents: read baseline -- the one
  # exception WorkflowPermissionsMinimizationTest allows inside a pull_request-triggered
  # workflow (fork PRs get a read-only token for code-scanning regardless).
  security-dast-sarif:
    needs: build
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security-dast.yml
    with:
      image-tag: "pr-${{ github.event.number }}"
      run-full-scan: false
