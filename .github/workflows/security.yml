name: "Security Scan"

# Repaired into a pure schedule + workflow_dispatch wrapper (SR-NA-03: weekly CVE
# re-detection, plus a manual full-scan escape hatch) around the secret-free reusable
# core. No push/pull_request triggers of its own anymore -- those responsibilities moved
# to quality.yml / pull-request.yml, which call the same _build core uniformly for every
# branch push and every PR (including forks) (ADR-CI-01).
#
# _security-dast.yml builds the jar and the Docker image it scans in its own run (ADR-CI-06)
# -- no more "docker manifest inspect ghcr.io/..." precondition on a prior push.

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC — post-commit CVE detection (SR-NA-03)
  workflow_dispatch:
    inputs:
      run_full_scan:
        description: "Run ZAP full active scan (~30 min). Disabled by default."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      cache-prefix: security

  # Job id carries the "-sarif" suffix (elevated-scope allowlist, gate 5.2) for the
  # security-events: write grant its upload-sarif steps need.
  security-dast-sarif:
    needs: build
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security-dast.yml
    with:
      image-tag: "scheduled-${{ github.run_id }}"
      run-full-scan: ${{ github.event_name == 'workflow_dispatch' && inputs.run_full_scan == true }}
