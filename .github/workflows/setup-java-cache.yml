name: "Setup Java and Maven/Node Cache"

# Reusable workflow that installs JDK 23 (Temurin) and restores Maven + Node caches.
#
# Usage in a calling job:
#   jobs:
#     my-job:
#       uses: ./.github/workflows/setup-java-cache.yml
#       with:
#         cache-prefix: verify   # Matches the cache key written by the compile job
#
# Restrictions (GitHub Actions reusable workflow limits):
#   - The `env` context is NOT available in `with:` -- all inputs must be literals or
#     expressions using `github`, `inputs`, or `needs` context.
#   - This workflow only RESTORES caches (read-only). The compile job in each calling
#     workflow writes the cache with actions/cache (read-write).
#
# Cache strategy:
#   compile writes with actions/cache (saves + restores),
#   later jobs restore with actions/cache/restore (read-only).

on:
  workflow_call:
    inputs:
      cache-prefix:
        description: >
          Logical suffix that distinguishes cache key families between workflows.
          Use "verify" for the push-test workflow and "main" for build-and-deploy.
        required: true
        type: string

# ADR-CI-03: explicit least-privilege baseline (gate 5.2). This file is unused dead code
# (superseded by the .github/actions/setup-java-cache composite action; nothing calls it --
# see WorkflowYamlInventoryTest's field javadoc) but it is still parsed by the CI structural
# gates, so it still needs an explicit top-level permissions: block like every other file.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 23 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Restore Maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ inputs.cache-prefix }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-${{ inputs.cache-prefix }}-

      - name: Restore Node binary cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node
          key: ${{ runner.os }}-node-${{ inputs.cache-prefix }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ inputs.cache-prefix }}-

      - name: Restore node_modules cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-${{ inputs.cache-prefix }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-${{ inputs.cache-prefix }}-
