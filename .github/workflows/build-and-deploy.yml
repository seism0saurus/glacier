name: "Build and deploy"

# Privileged, secret-bearing tier (ADR-CI-01): the ONLY workflow that can ever reach the
# deploy credentials (SSH_KEY/KNOWN_HOSTS/SSH_USER/SSH_PORT). Releases are cut as
# annotated git tags (ADR-CI-18, `v*.*.*`) via push_version.sh -- there is no
# pull_request trigger here (ADR-CI-10: the former `pull_request: closed` trigger let
# closing a same-repo PR against main run the whole chain, including deploy, in PR event
# context; that shape is now categorically impossible since this file has no
# pull_request-shaped trigger at all).

on:
  push:
    tags: [ "v*.*.*" ]

permissions: {}

jobs:
  # G6 consolidation (Phase 2 Round 2 cross-review fix, ADR-SEC-02): the release path now
  # delegates compile -> test -> package to the same secret-free reusable core every other
  # caller uses (quality.yml, pull-request.yml), instead of re-declaring an independent
  # compile/test/package trio that skipped the sqlite-jdbc/bigbone SHA-256 checksum tripwire.
  # This is the ONE pipeline that ships a cosign-signed, SLSA-attested image -- it must not
  # also be the one pipeline exempt from dependency-substitution verification (OWASP A08:2021).
  # cache-prefix "main" matches the family the release/main branch already used, so the
  # mutation job's cache-restore step below (also "main") still hits a warm cache.
  # permissions: contents: read is granted explicitly here (rather than relying on this
  # file's top-level `permissions: {}`) because a reusable-workflow call's internal jobs are
  # capped by the calling job's effective permission set -- quality.yml/pull-request.yml both
  # grant contents: read for the same reason.
  test:
    uses: ./.github/workflows/_build.yml
    permissions:
      contents: read
    with:
      cache-prefix: main

  mutation:
    # Mutation testing runs after unit tests pass, on the release tag only.
    # Scoped to Java source directories of the 14 PITest target classes (ADR-FUZZ-04).
    # P2-11 / Sec-08: MutationRegexLockstepTest verifies this regex matches every package
    # listed in <targetClasses> in pom.xml -- update BOTH files together when adding new targets.
    # Informational/gating for main -- NOT a prerequisite for publish-image or deploy.
    # No production secrets in env (SR-FUZZ-06).
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2

      - name: Detect relevant Java source changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "pom.xml")
          if echo "$CHANGED" | grep -qE \
            "^src/(main|test)/java/de/seism0saurus/glacier/(util|share|webservice/(messaging|cache|security)|mastodon)/|^pom\.xml"; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 23 and cache (restore)
        if: steps.filter.outputs.java == 'true'
        uses: ./.github/actions/setup-java-cache
        with:
          cache-prefix: main

      - name: Run PITest mutation coverage
        if: steps.filter.outputs.java == 'true'
        run: ./mvnw --batch-mode -P mutation org.pitest:pitest-maven:mutationCoverage -Dmaven.test.failure.ignore=false --file pom.xml

      - name: Upload PITest reports
        if: steps.filter.outputs.java == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pit-reports
          path: target/pit-reports/

  # NOTE: the standalone "package" job that used to live here is gone -- the "test" job
  # above now delegates to _build.yml, whose own package sub-job produces the identical
  # "glacier" (jar) and "sbom" (CycloneDX) artifacts under the same names, so every
  # downstream job below keeps working unchanged by depending on "test" instead of "package"
  # (a reusable-workflow-call job is not "done" until all of its internal jobs, including
  # package, have finished -- so needs: test still gates on the jar/SBOM being uploaded).

  # Dependency-graph submission needs contents: write -- kept as its own job, confined to
  # this single privileged workflow (WorkflowPermissionsMinimizationTest:
  # deployPublishAndDependencySubmissionOnlyExistInBuildAndDeploy), never inside the
  # secret-free/least-privilege _build.yml core that untrusted-tier callers also use.
  dependency-submission:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8

  # ── Playwright e2e matrix ─────────────────────────────────────────────────
  #
  # Each matrix leg boots its own isolated docker-compose stack because the
  # test modes require mutually incompatible backend configurations:
  #
  #   standard   -- default stack (docker-compose.yaml only)
  #                 chromium + firefox + webkit Playwright projects.
  #                 This leg also builds the Docker image and saves it as an
  #                 artifact for trivy-image-sarif and zap-and-headers to consume.
  #   killswitch -- GLACIER_FALLBACK_ENABLED=false
  #                 (docker-compose.override.killswitch.yaml)
  #   a11y       -- WCAG 2.2 AA axe-core scans, chromium-only
  #                 (docker-compose.override.a11y.yaml)
  #   insecure   -- plain-HTTP :8081 loopback, COOKIE_SECURE=false
  #                 (docker-compose.override.insecure.yaml)
  #
  # It is NOT safe to share one running stack across these legs -- the killswitch
  # and insecure overrides change runtime behaviour that other projects depend on
  # being in the default state.  See glacier-fallback-mode-discipline skill and
  # infrastructure/docker-compose.override.*.yaml for details.
  #
  # publish-image and security jobs gate on ALL matrix legs passing.
  e2e:
    runs-on: ubuntu-latest
    needs: [test, dependency-submission]
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            # No override file -- runs the default stack.
            # Executes: chromium + firefox + webkit Playwright projects.
            # Also builds the Docker image artifact for trivy-image-sarif + zap-and-headers.
            compose_overrides: ""
            artifact_suffix: ""
            build_image: true
          - variant: killswitch
            # GLACIER_FALLBACK_ENABLED=false; /rest/messages returns 404.
            # Executes: killswitch Playwright project only.
            compose_overrides: "-f docker-compose.override.killswitch.yaml"
            artifact_suffix: "-killswitch"
            build_image: false
          - variant: a11y
            # WCAG 2.2 AA axe-core accessibility scans (chromium-only).
            # Executes: a11y Playwright project only.
            compose_overrides: "-f docker-compose.override.a11y.yaml"
            artifact_suffix: "-a11y"
            build_image: false
          - variant: insecure
            # Plain-HTTP :8081 loopback; COOKIE_SECURE=false.
            # Executes: insecure Playwright project only.
            compose_overrides: "-f docker-compose.override.insecure.yaml"
            artifact_suffix: "-insecure"
            build_image: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Use cache for node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node_modules-main-${{ hashFiles('~/.m2/frontend/node_modules') }}
          restore-keys: |
            ${{ runner.os }}-node_modules-main-
      - name: Use cache for ms-playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-main-${{ hashFiles('~/.cache/ms-playwright') }}
          restore-keys: |
            ${{ runner.os }}-playwright-main-
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Build Docker image (standard leg only)
        if: matrix.build_image == true
        working-directory: infrastructure
        run: |
          docker compose -f docker-compose.yaml build
          docker save "ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}" -o glacier-image.tar
      - name: Upload image as artifact (standard leg only)
        if: matrix.build_image == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: glacier-image
          path: infrastructure/glacier-image.tar

      - name: Run syft SBOM against Docker image (standard leg only)
        if: matrix.build_image == true
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft "ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}" \
            -o cyclonedx-json=sbom-image.json
      - name: Upload image SBOM (standard leg only)
        if: matrix.build_image == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image
          path: sbom-image.json
          retention-days: 90

      - name: Start e2e test (${{ matrix.variant }}) inside docker-compose
        working-directory: infrastructure
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          echo "to update data in infrastructure-content.tar.gz run 'sudo tar -czf infrastructure-content.tar.gz mastodon mastodon.env postgres redis proxy.* v3.ext dynamic.yml traefik.yml'"
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          # shellcheck disable=SC2086
          docker compose \
            -f docker-compose.yaml \
            $COMPOSE_OVERRIDES \
            up --build --abort-on-container-exit playwright --exit-code-from playwright
      - name: Upload Playwright report (${{ matrix.variant }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report${{ matrix.artifact_suffix }}
          path: frontend/playwright-report
      - name: Upload Playwright Error screenshots (${{ matrix.variant }})
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-error-screenshots${{ matrix.artifact_suffix }}
          path: frontend/test-results
      - name: Show logs of service (${{ matrix.variant }})
        working-directory: infrastructure
        if: failure()
        env:
          COMPOSE_OVERRIDES: ${{ matrix.compose_overrides }}
        run: |
          docker ps
          # shellcheck disable=SC2086
          docker compose -f docker-compose.yaml $COMPOSE_OVERRIDES logs

  # ── Trivy filesystem scan (jar dependency CVEs) ───────────────────────────
  # Job id carries the "-sarif" suffix so it is on the elevated-scope allowlist (gate 5.2)
  # for the security-events: write grant its upload-sarif step needs.
  trivy-fs-sarif:
    runs-on: ubuntu-latest
    needs: [test, dependency-submission]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Trivy filesystem scan (jar dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: infrastructure/glacier/
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: infrastructure/security/.trivyignore-fs
          format: sarif
          output: trivy-fs-report.sarif
      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        if: always()
        continue-on-error: true # RR-1/ADR-CI-15: finding gate stays on the scanner exit-code above.
        with:
          sarif_file: trivy-fs-report.sarif
          category: trivy-fs

  # ── Trivy image scan (OS-layer CVEs -- scans the exact image before push) ──
  # Depends on the standard e2e leg which builds and saves the Docker image.
  trivy-image-sarif:
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
      security-events: write
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier-image
          path: ./
      - name: Load image into Docker
        run: docker load -i glacier-image.tar
      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            -v "$(pwd)/infrastructure/security:/scanconfig" \
            aquasec/trivy:0.57.0 image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /scanconfig/.trivyignore \
            --format sarif \
            --output trivy-report.sarif \
            "ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}"
      - name: Upload Trivy image SARIF
        if: always()
        continue-on-error: true # RR-1/ADR-CI-15: finding gate stays on the scanner exit-code above.
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: trivy-report.sarif
          category: trivy-image

  # ── Dynamic security scan (ZAP baseline + security headers + WS BOLA) ────────
  # Runs against the running app started from the jar artifact (before the image
  # is pushed to the registry -- a finding here blocks publish-image and deploy).
  # CodeQL static analysis is enforced via codeql.yml + GitHub branch-protection
  # required status checks ("CodeQL / Analyze (java-kotlin)" and
  # "CodeQL / Analyze (javascript-typescript)") -- configure those under
  # Settings -> Branches -> main -> Require status checks to pass.
  # No SARIF upload happens in this job -- it only needs contents: read.
  zap-and-headers:
    runs-on: ubuntu-latest
    needs: e2e
    permissions:
      contents: read
    env:
      GLACIER_IMAGE_TAG: "${{ github.ref_name }}"
      REPOSITORY: "/home/runner/work/glacier/glacier/"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Download glacier jar
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier
          path: infrastructure/glacier
      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose
      - name: Start security stack
        working-directory: infrastructure
        run: |
          tar -xf infrastructure-content.tar.gz -C ./
          chmod -R a+rwx mastodon
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.override.security.yaml \
            up --build -d glacier proxy
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then
              echo "glacier ready"; break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/ > /dev/null
      - name: ZAP baseline scan
        working-directory: infrastructure
        run: |
          docker run --rm \
            --network=infrastructure_mastodon \
            -v "$(pwd)/security:/zap/wrk" \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap/baseline.yaml \
            || true
      - name: Diff ZAP baseline against committed allowlist
        working-directory: infrastructure
        run: |
          python3 security/scripts/diff-zap-baseline.py \
            security/zap-baseline.json \
            security/baselines/zap-baseline.json \
            --threshold Medium
      - name: Header audit
        working-directory: infrastructure
        env:
          BASE_URL: "http://localhost:8080"
          SHARE_BASE_URL: "http://localhost:8080"
          EXPECT_SECURE_COOKIE: "false"
        run: bash security/scripts/header-audit.sh
      - name: WebSocket BOLA probe
        working-directory: infrastructure
        env:
          BASE_URL: "http://localhost:8080"
        run: |
          pip install --quiet websocket-client==1.8.0
          python3 security/scripts/ws-bola-probe.py
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-main
          path: |
            infrastructure/security/zap-baseline.html
            infrastructure/security/zap-baseline.json
      - name: Compose logs on failure
        if: failure()
        working-directory: infrastructure
        run: |
          docker ps -a
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.override.security.yaml \
            logs --tail=200
      - name: Tear down
        if: always()
        working-directory: infrastructure
        run: |
          docker compose \
            -f docker-compose.yaml \
            -f docker-compose.override.security.yaml \
            down -v --remove-orphans

  # ─────────────────────────────────────────────────────────────────────────────
  # publish-image only runs when ALL quality gates pass:
  #   Functional:    e2e matrix (standard + killswitch + a11y + insecure)
  #   Security:      trivy-fs-sarif (jar CVEs) + trivy-image-sarif (OS-layer CVEs) +
  #                  zap-and-headers (ZAP baseline + security headers + WS BOLA)
  # Static analysis: CodeQL runs in codeql.yml -- enforce via branch-protection
  #                  required status checks on the main branch.
  # ─────────────────────────────────────────────────────────────────────────────
  publish-image:
    runs-on: ubuntu-latest
    needs: [e2e, trivy-fs-sarif, trivy-image-sarif, zap-and-headers]
    permissions:
      contents: read       # read the repository
      packages: write      # push the image + attestations to ghcr
      id-token: write      # keyless OIDC identity for cosign + attestations (Sigstore/Fulcio)
      attestations: write  # record provenance / SBOM attestations
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: glacier-image
          path: ./
      - name: Download image SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-image
          path: ./
      - name: Load image into Docker
        run: |
          docker load -i glacier-image.tar
      - name: Tag Docker Image for Pushing
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag "ghcr.io/seism0saurus/glacier:${REF_NAME}" ghcr.io/seism0saurus/glacier:main
          docker tag "ghcr.io/seism0saurus/glacier:${REF_NAME}" ghcr.io/seism0saurus/glacier:latest
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      - name: Push Docker Image to GitHub Container Registry
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker push "ghcr.io/seism0saurus/glacier:${REF_NAME}"
          docker push ghcr.io/seism0saurus/glacier:main
          docker push ghcr.io/seism0saurus/glacier:latest
          # Resolve the immutable content digest of the pushed image (identical for all three tags).
          DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' \
            "ghcr.io/seism0saurus/glacier:${REF_NAME}" \
            | grep '^ghcr.io/seism0saurus/glacier@' | head -1 | cut -d@ -f2)
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed digest: ${DIGEST}"
      # ── Supply-chain provenance: keyless signature + SLSA provenance + SBOM ──
      # All keyless via the workflow's OIDC identity (Sigstore/Fulcio) — no long-lived keys.
      # Consumers verify with:
      #   cosign verify ghcr.io/seism0saurus/glacier@<digest> \
      #     --certificate-identity-regexp 'https://github.com/seism0saurus/glacier/.*' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      #   cosign verify-attestation --type slsaprovenance ... ghcr.io/seism0saurus/glacier@<digest>
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign image (keyless)
        run: cosign sign --yes ghcr.io/seism0saurus/glacier@${{ steps.push.outputs.digest }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/seism0saurus/glacier
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2.4.0
        with:
          subject-name: ghcr.io/seism0saurus/glacier
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-image.json
          push-to-registry: true

  deploy:
    runs-on: ubuntu-latest
    needs: publish-image
    environment: glacier.seism0saurus.de
    # Defense-in-depth: redundant in-repo tag guard (RR-4 partial mitigation).
    # The workflow already only triggers on push of `v*.*.*` tags; this condition
    # re-asserts that boundary at the job level in case the trigger is ever
    # broadened, so the deploy job cannot fire on a non-tag ref regardless.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Prepare ssh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
        run: |
          echo "${SSH_KEY}" > ssh.key
          chmod 600 ssh.key
          mkdir ~/.ssh
          echo "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
      - name: Restart docker-compose
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ vars.SSH_HOST }}
        run: ssh -i ssh.key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" -C "sudo /usr/local/bin/upgrade-glacier.sh"
