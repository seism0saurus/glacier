networks:
  mastodon:

services:
  db:
    image: postgres:14-alpine
    container_name: db
    restart: unless-stopped
    shm_size: 256mb
    expose:
      - "5432"
    networks:
      - mastodon
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mastodon', '-d', 'mastodon']
    volumes:
      - ./postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "mastodon"
      POSTGRES_PASSWORD: "password"
      POSTGRES_DB: "mastodon"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - mastodon
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    volumes:
      - ./redis:/data

  web:
    image: ghcr.io/mastodon/mastodon:v4.3.3
    container_name: web
    restart: unless-stopped
    env_file: mastodon.env
    command: bundle exec puma -C config/puma.rb
    expose:
      - "3000"
    networks:
      - mastodon
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mastodon.rule=Host(`proxy`) && !PathPrefix(`/api/v1/streaming`)"
      - "traefik.http.routers.mastodon.entrypoints=websecure"
      - "traefik.http.routers.mastodon.middlewares=no-cache@docker"
      - "traefik.http.routers.mastodon.tls=true"
      - "traefik.http.middlewares.no-cache.headers.customresponseheaders.Cache-Control=no-cache"
      - "traefik.http.middlewares.no-cache.headers.customresponseheaders.Pragma=no-cache"
      - "traefik.http.middlewares.no-cache.headers.customresponseheaders.force=true"
    healthcheck:
      test: ['CMD-SHELL',"curl --noproxy localhost localhost:3000/health | grep -q 'OK' || exit 1"]
    volumes:
      - ./mastodon:/mastodon/public/system
    depends_on:
      - db
      - redis

  streaming:
    image: ghcr.io/mastodon/mastodon-streaming:v4.3.3
    container_name: streaming
    restart: unless-stopped
    env_file: mastodon.env
    command: node ./streaming/index.js
    expose:
      - "4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.streaming.rule=Host(`proxy`) && PathPrefix(`/api/v1/streaming`)"
      - "traefik.http.routers.streaming.entrypoints=websecure"
      - "traefik.http.routers.streaming.tls=true"
    networks:
      - mastodon
    healthcheck:
      test: ['CMD-SHELL', "curl --noproxy localhost localhost:4000/api/v1/streaming/health | grep -q 'OK' || exit 1"]
    depends_on:
      - db
      - redis

  sidekiq:
    image: ghcr.io/mastodon/mastodon:v4.3.3
    container_name: sidekiq
    restart: unless-stopped
    env_file: mastodon.env
    command: bundle exec sidekiq
    networks:
      - mastodon
    volumes:
      - ./mastodon:/mastodon/public/system
    healthcheck:
      test: ['CMD-SHELL', "ps aux | grep '[s]idekiq\ 6' || false"]
    depends_on:
      - db
      - redis

  proxy:
    image: traefik:3
    container_name: proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"
    volumes:
      - ./traefik.yml:/traefik.yml
      - ./dynamic.yml:/dynamic.yml
      - ./proxy.crt:/etc/ssl/proxy.crt
      - ./proxy.key:/etc/ssl/proxy.key
      - /var/run/docker.sock:/var/run/docker.sock
    # Add "share.proxy" as a network alias so that all containers in the
    # mastodon network (glacier, playwright) can resolve the share subdomain
    # to the Traefik proxy without needing extra_hosts IP entries.
    # Traefik then routes Host:`share.proxy` to the glacier backend per dynamic.yml.
    networks:
      mastodon:
        aliases:
          - share.proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
    healthcheck:
      test: ['CMD-SHELL', "traefik healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - web
      - streaming

  glacier:
    container_name: glacier
    image: ghcr.io/seism0saurus/glacier:${GLACIER_IMAGE_TAG}
    build:
      context: ./glacier
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - mastodon
    volumes:
      # Mount the certificate of the proxy service so no TLS errors are thrown
      - ./proxy.crt:/certificates/proxy.crt
    environment:
      # Start spring with the default profile
      SPRING_PROFILES_ACTIVE: "default"

      # Access the e2e mastodon instance.
      # Key is only usable in this local instance, so it is not a problem to publish it.
      INSTANCE: "proxy"
      HANDLE: "glacier_e2e_test@proxy"
      ACCESS_KEY: "hMfsEYl9Hgk2Pt-iTyZyvKvfbXh9tjXV41-tsr3vRak"

      # informational settings for gdpr page and others
      MY_DOMAIN: "localhost:443"
      MY_WEBSITE: "seism0saurus.de"
      MY_NAME: "seism0saurus"
      MY_STREET_AND_NUMBER: "sometherestreet 1"
      MY_ZIP_CODE: "123456"
      MY_CITY: "somecity"
      MY_COUNTRY: "Germany"
      MY_MAIL: "kontakt@seism0saurus.de"
      MY_PHONE: "+1234567890"

      # Use the system certificates which got mounted with the volume
      USE_SYSTEM_CA_CERTS: true
      DEVMODE: true

      # ── Share-link feature configuration ────────────────────────────────────
      # Share subdomain hostname.  Must match the Traefik router rule in dynamic.yml
      # and the TLS SAN in v3.ext.  In e2e: "share.proxy" (the Traefik proxy
      # container hostname).  In production: "share.<glacier.domain>".
      GLACIER_SHARE_HOST: "share.proxy"

      # HMAC-SHA256 secret for signing image-proxy URLs (ADR-SHARE-07).
      # In e2e a static dummy value is acceptable (no external traffic reaches
      # the image proxy in CI).  In production this MUST be a random secret
      # ≥32 bytes set via an env-var or secrets manager — the backend refuses
      # to start in secure mode (COOKIE_SECURE=true) if this is absent or short.
      # DO NOT commit a real production secret here.
      GLACIER_SHARE_IMGPROXY_HMAC_SECRET: "e2e-dummy-hmac-secret-not-for-production-use"

      # Hard caps: max active share links per sharer wallet, per source IP,
      # and globally.  Viewer concurrency cap per individual link.
      # Rationale in ADR-SHARE-09 / architect Round 2 cap discussion.
      GLACIER_SHARE_MAX_ACTIVE_PER_SHARER: "3"
      GLACIER_SHARE_MAX_ACTIVE_PER_IP: "10"
      GLACIER_SHARE_MAX_VIEWERS_PER_LINK: "100"

      # Link lifetime as ISO-8601 duration (7 days).  Sharers can revoke earlier.
      GLACIER_SHARE_TTL: "P7D"

      # How often the background sweeper runs to expire old share links (ms).
      # 300 000 ms = 5 minutes.  Sweeper is an optimisation; expiry is enforced
      # on every resolve() call independent of this interval.
      GLACIER_SHARE_SWEEP_INTERVAL_MS: "300000"

      # Caffeine cache TTLs for the image proxy (ADR-SHARE-07).
      # Positive cache: 1 h (3600 s) — avatars/media update rarely.
      # Negative cache: 60 s — avoids stampede on transient upstream failures
      #   while staying short enough not to mislead viewers for long.
      GLACIER_SHARE_IMGPROXY_POSITIVE_CACHE_SECONDS: "3600"
      GLACIER_SHARE_IMGPROXY_NEGATIVE_CACHE_SECONDS: "60"
    healthcheck:
      test: [ 'CMD-SHELL', "wget -q --spider localhost:8080 || exit 1" ]
    depends_on:
      - proxy
      - sidekiq
      - streaming
      - web

  playwright:
    container_name: playwright
    image: mcr.microsoft.com/playwright:v1.51.0
    networks:
      - mastodon
    volumes:
      - ${REPOSITORY}/:/repo
      - ${HOME}/.m2/frontend/node_modules:/repo/frontend/node_modules
      - ${HOME}/.cache/ms-playwright:/root/.cache/ms-playwright
    working_dir: /repo/frontend
    command:
      - /bin/bash
      - -c
      - |
        # Install the dependencies first. We have to wait for the other containers either way
        npm install
        npx playwright install --with-deps
        
        # Wait for Mastodon behind the proxy to be ready
        count=0
        max_retries=60
        while ! curl -ksf https://proxy:443/.well-known/nodeinfo &> /dev/null; do
          count=$((count + 1))
          if [ "$${count}" -ge "$${max_retries}" ]; then
            echo "Max retries reached ($${max_retries}). Aborting."
            exit 1
          fi
          echo "Attempt $$count/$${max_retries}: Waiting for proxy to be ready..."
          sleep 2
        done
        echo "proxy is ready!"

        # Wait for Glacier to become ready before starting tests against it
        count=0
        max_retries=60
        while ! curl -ksf http://glacier:8080/ &> /dev/null; do
          count=$((count + 1))
          if [ "$${count}" -ge "$${max_retries}" ]; then
            echo "Max retries reached ($${max_retries}). Aborting."
            exit 1
          fi
          echo "Attempt $$count/$${max_retries}: Waiting for glacier to be ready..."
          sleep 2
        done
        
        # Run the tests
        npx playwright test
    environment:
      # Mastodon is reachable behind the proxy
      # Key is only usable in this local instance, so it is not a problem to publish it.
      MASTODON_USER_API_URL: "https://proxy"
      MASTODON_USER_ACCESS_TOKEN: "pyPuRhw4cZJHN4QJuMX8mo9CFmziZp_BjvuCf71sV34"

      # Glacier runs on port 8080
      GLACIER_HANDLE: "@glacier_e2e_test@proxy"
      BASE_URL: "http://glacier:8080"

      # Share subdomain base URL for share-link Playwright specs.
      # Reaches the same glacier container via Traefik (port 443, TLS).
      # Traefik routes Host:share.proxy to glacier:8080 per dynamic.yml.
      GLACIER_SHARE_BASE_URL: "https://share.proxy"

      # Since the runner is not very fast, we wait a little bit longer,
      # if we want to test that something does not show up.
      WAIT_FOR: "15000"
    depends_on:
      - proxy
      - streaming
      - web
      - glacier